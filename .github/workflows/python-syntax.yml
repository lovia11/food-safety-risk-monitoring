name: Python syntax gate

on:
  push:
    branches:
      - ux-redesign-v1
  pull_request:
    branches:
      - ux-redesign-v1

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests scripts
